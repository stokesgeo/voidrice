# doas-agent.conf: root commands you allow without a password, so Codex
# can run them through `cdxb doas` in a session started with `cdxb -d`.
# /etc/doas.conf is doas.conf followed by this file:
#
#	f=$(mktemp); cd ~/.local/share/openbsd
#	cat doas.conf doas-agent.conf > "$f"
#	doas -C "$f" && doas install -o root -g wheel -m 0640 "$f" /etc/doas.conf
#
# `cdxb review` does the same when you accept a proposal for this file.
#
# How to read a rule: "permit nopass :wheel as root cmd PATH args A B"
# lets anyone in group wheel run exactly PATH with exactly the arguments
# A B, as root, with no password. Without "args", ANY arguments are
# allowed: always write args. Write PATH in full: doas compares it as
# text with what was typed, so Codex must type the same full path.
# The last matching rule wins, so these come after the wheel rule.
#
# doas cannot tell Codex from you: both run as your user. A nopass rule
# here works for any program you run, in the box or not. Inside the box,
# the kernel refuses setuid programs, so doas itself cannot run there;
# `cdxb doas` hands the request to a small relay outside the box, which
# runs `doas -n`. -n never asks for a password and fails for every rule
# without nopass, so these lines are the whole list of what it can do.
#
# Nothing is allowed by default. Examples, to uncomment and adapt:

#permit nopass :wheel as root cmd /usr/sbin/rcctl args restart sndiod
#permit nopass :wheel as root cmd /usr/sbin/rcctl args restart ntpd
