# doas-agent.conf: the root commands Codex may run, with no password, through
# `cdxb doas` in a `cdxb -d` session. /etc/doas.conf is doas.conf followed by
# this file: `cdxb review` installs the pair when you accept a proposal; to
# install it again, rerun vertrice-install (doas sh ~/.local/bin/vertrice-install).
# Only nopass rules, each with the full path and `args` (no args: any args).
# They work for anything you run, in the box or not. None by default:

#permit nopass :wheel as root cmd /usr/sbin/rcctl args restart sndiod
