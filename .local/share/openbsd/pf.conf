# pf.conf(5) for a laptop: nothing comes in unasked, everything goes out.
# pfctl -sr shows the loaded rules.
set skip on lo
block in
pass out
pass in inet6 proto icmp6 icmp6-type { neighbrsol neighbradv routeradv }	# IPv6 needs these to find neighbours and routers (slaacd(8))
block return out log proto {tcp udp} user _pbuild	# a port build gets no network
#pass in on egress proto tcp to port ssh	# to reach this laptop's sshd
