# pf.conf for a laptop: vertrice's sample.
#
# OpenBSD's own /etc/pf.conf passes all traffic in and out (with state) and
# blocks only remote X11. That suits a machine whose owner decides which
# services listen. A laptop joins networks it does not control (cafes,
# hotels, conferences), so this file lets nothing in that the laptop did not
# ask for. It is optional; OpenBSD's default is not unsafe, only open.
#
# Install, as root:  vertrice-install pf  (the plan), then  vertrice-install -y pf
# That checks the file with pfctl -nf, keeps the old one as /etc/pf.conf.orig,
# and loads the new one. By hand: pfctl -nf FILE, then pfctl -f /etc/pf.conf.
# See what is loaded: pfctl -sr.
#
# How pf reads this: for each packet, the LAST rule that matches decides,
# unless a matching rule says "quick", which decides at once. So the general
# rules come first and the exceptions after them.

# Inbound ports to open, for example "{ ssh }" to reach this laptop's sshd.
# Nothing is open by default. Of the packages in pkglist, only transmission
# listens for the network (its peer port, 51413, TCP and UDP): with this file
# it still downloads, but other peers cannot connect to it. To open ports, uncomment this line and the
# "pass in on egress" rule below. (pf has no empty list, so the rule is
# commented out rather than given no ports.)
#tcp_in = "{ ssh }"

# lo is the machine talking to itself (127.0.0.1, ::1): not filtered.
set skip on lo

# Inbound: drop everything by default. Dropped packets get no answer, so a
# scan of the network does not see the laptop. (drop is pf's default block
# policy; OpenBSD's own file uses "block return" and pass rules that open
# everything again.)
block in

# Outbound: everything the laptop starts may leave. Pass rules keep state by
# default: pf records each connection, so its replies, and ICMP errors about
# it (unreachable, packet too big), come back in past the block above.
pass out

# IPv6 needs these to work at all: neighbour solicitation and advertisement
# (the IPv6 form of ARP) and router advertisements (how slaacd learns the
# address and the default route). They arrive unasked, so "block in" would
# stop them. IPv4 needs no rule: ARP is below pf, and dhcpleased reads its
# replies through bpf, which sees packets before pf does (from memory).
pass in inet6 proto icmp6 icmp6-type { neighbrsol neighbradv routeradv }

# The ports listed in tcp_in, on the interface with the default route
# (egress) only.
#pass in on egress proto tcp to port $tcp_in

# A packet from outside that claims to come from 127.0.0.0/8 or ::1 is
# forged: drop it, whatever any rule above says.
antispoof quick for lo0

# uRPF: drop a packet whose source address would not be routed back out the
# interface it came in on. Commented out, as in /etc/examples/pf.conf, which
# marks it "use with care": with Wi-Fi and a wired dock both up, replies can
# arrive on the interface that does not hold the default route, and would be
# dropped. "block in" above already stops nearly all it would.
#block in quick from urpf-failed to any

# From OpenBSD's own pf.conf, kept: no remote connections to X (ports
# 6000-6010). Made quick, so a port added to tcp_in can never open them. X
# on OpenBSD does not listen on TCP anyway: this is a second lock.
block return in quick on ! lo0 proto tcp to port 6000:6010

# From OpenBSD's own pf.conf, kept: the ports build user gets no network.
# The ports tree fetches as another user first, then builds offline.
block return out log proto {tcp udp} user _pbuild
