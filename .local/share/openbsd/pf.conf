# pf.conf for a laptop: nothing comes in unasked, everything goes out. pfctl -sr shows the rules.
set skip on lo
block in
pass out
pass in inet6 proto icmp6 icmp6-type { neighbrsol neighbradv routeradv }	# IPv6 neighbours, slaacd
block return out log proto {tcp udp} user _pbuild	# no network for port builds (OpenBSD's default)
#pass in on egress proto tcp to port ssh	# to reach this laptop's sshd
