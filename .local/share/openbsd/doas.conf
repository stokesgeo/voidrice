# doas.conf for vertrice. Install as /etc/doas.conf, mode 0600 or 0640,
# owned by root, then check it with `doas -C /etc/doas.conf`.
#
# doas(1) replaces the caller's environment with a minimal one for the
# target user (HOME, PATH, SHELL, USER, LOGNAME of root; DISPLAY and TERM
# kept). That is the sane default: a root command does not inherit the
# user's PATH or EDITOR, so `doas crontab -e` or `doas vi` runs base vi.
# Keep it that way; do not add keepenv.
#
# persist: after one password, doas asks again only after 5 minutes of
# disuse, per terminal. No nopass rules: a passwordless root command is
# root for anything running as the user.

permit persist :wheel
