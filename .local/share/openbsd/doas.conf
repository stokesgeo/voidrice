# doas.conf for vertrice. Install as /etc/doas.conf, mode 0600 or 0640,
# owned by root, then check it with `doas -C /etc/doas.conf`.
#
# doas(1) gives the command a minimal environment for the target user
# (HOME, PATH, SHELL, USER, LOGNAME of root; DISPLAY and TERM kept), so
# `doas crontab -e` or `doas vi` runs base vi, not your EDITOR. Keep it that
# way; do not add keepenv.
#
# One thing it does not reset: doas looks the command up in YOUR PATH. A
# script in ~/.local/bin named like a command you run with doas would run
# as root. The profile puts ~/.local/bin last so base names win; for
# anything sensitive, type the full path (doas /sbin/mount ...).
#
# setenv ENV: `doas -s` starts an interactive root shell, which then reads
# /root/.kshrc (installed from root.kshrc). ENV only affects interactive
# shells, so other commands are unaffected. Use `doas -s`, not su: su keeps
# your ENV and would run your own kshrc as root.
#
# persist: after one password, doas asks again only after 5 minutes of
# disuse, per terminal. No nopass rules: a passwordless root command is
# root for anything running as the user.

permit persist setenv { ENV=/root/.kshrc } :wheel
