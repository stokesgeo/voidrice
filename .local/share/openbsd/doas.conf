# /etc/doas.conf is this line followed by doas-agent.conf. doas -s reads /root/.kshrc.
permit setenv { ENV=/root/.kshrc } :wheel

# Removable media: usbctl is the one broad door; it validates the device and
# target itself. usb-handler mounts known disks through a narrow pair, one per
# fstab mount point (uncomment and repeat per disk):
#permit nopass :wheel cmd /sbin/mount  args /mnt/backup
#permit nopass :wheel cmd /sbin/umount args /mnt/backup
permit nopass :wheel cmd /usr/local/bin/usbctl
