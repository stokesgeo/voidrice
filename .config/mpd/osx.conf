# The Mac's sound output, which mpd.conf includes: CoreAudio, on the device
# chosen in System Settings, Sound. The launchd agent vertrice.mpd starts
# mpd with mpd.conf named, since mpd on macOS looks for its settings in
# ~/Library/Application Support, not ~/.config.
audio_output {
        type            "osx"
        name            "CoreAudio"
}
