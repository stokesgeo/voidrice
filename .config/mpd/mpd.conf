# mpd settings. Local only: bound to 127.0.0.1. ncmpcpp reads the same music
# directory.
music_directory		"~/Music"
playlist_directory	"~/.config/mpd/playlists"

auto_update "yes"
bind_to_address "127.0.0.1"
restore_paused "yes"
max_output_buffer_size "16384"

# The sound card's output is each system's own, beside this file: sndio on
# the X220, CoreAudio on the Mac. Each machine checks out only its own, so
# the other line finds no file and is skipped.
include_optional "sndio.conf"
include_optional "osx.conf"

# The fifo feeds the ncmpcpp visualizer, which reads /tmp/mpd.fifo by default.
audio_output {
       type	"fifo"
       name	"Visualizer feed"
       path	"/tmp/mpd.fifo"
       format	"44100:16:2"
}
