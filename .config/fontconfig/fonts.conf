<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<!--
  IBM Plex everywhere: Mono for terminals, menus and the editor, Sans and
  Serif for the rest. IBM's own type family (the ibm-plex package), drawn for
  legibility: open counters, a slashed zero, distinct l 1 I and O 0.
  Noto Color Emoji fills in the status-bar and menu emoji.
-->
<fontconfig>
	<alias>
		<family>serif</family>
		<prefer>
			<family>IBM Plex Serif</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>IBM Plex Sans</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
	<alias>
		<family>sans</family>
		<prefer>
			<family>IBM Plex Sans</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>IBM Plex Mono</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
</fontconfig>
